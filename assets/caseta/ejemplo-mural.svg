<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
<defs>
  <linearGradient id="pared" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b1420"/><stop offset="1" stop-color="#120d16"/>
  </linearGradient>
  <linearGradient id="mural" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3a1666"/><stop offset="0.55" stop-color="#2e1150"/><stop offset="1" stop-color="#22093d"/>
  </linearGradient>
  <linearGradient id="suelo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1d1622"/><stop offset="1" stop-color="#0d0a10"/>
  </linearGradient>
  <linearGradient id="campo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3f8f3a"/><stop offset="1" stop-color="#2c6b29"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6">
    <stop offset="0" stop-color="#a868e8" stop-opacity="0.38"/><stop offset="1" stop-color="#a868e8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="reflejo" cx="0.5" cy="0" r="0.7">
    <stop offset="0" stop-color="#a868e8" stop-opacity="0.35"/><stop offset="1" stop-color="#a868e8" stop-opacity="0"/>
  </radialGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="14" result="b1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b2"/>
    <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
  </filter>
</defs>

